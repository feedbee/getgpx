services:
  app:
    build: .
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: track_hub
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
  mongodb:
    image: mongo:7.0.43-jammy
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mongo-data:
