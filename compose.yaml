services:
  app:
    build: .
    environment:
      MONGODB_URI: mongodb://mongodb:27017/getgpx
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/google/callback}
      SESSION_SECRET: ${SESSION_SECRET}
      TRACK_S3_BUCKET: ${TRACK_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      TRACK_S3_PREFIX: ${TRACK_S3_PREFIX:-dev}
      TRACK_FILE_DELIVERY: ${TRACK_FILE_DELIVERY:-stream}
      TRACK_PREVIEW_MAX_POINTS: ${TRACK_PREVIEW_MAX_POINTS:-200}
      TRACK_PREVIEW_PROVIDER: ${TRACK_PREVIEW_PROVIDER:-none}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      MAPBOX_PREVIEW_STYLE: ${MAPBOX_PREVIEW_STYLE:-mapbox/streets-v12}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      TRACK_CLOUDFRONT_DOMAIN: ${TRACK_CLOUDFRONT_DOMAIN:-}
      TRACK_CLOUDFRONT_PUBLIC_KEY_ID: ${TRACK_CLOUDFRONT_PUBLIC_KEY_ID:-}
      TRACK_CLOUDFRONT_PRIVATE_KEY_PATH: ${TRACK_CLOUDFRONT_PRIVATE_KEY_PATH:-}
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
  mongodb:
    image: mongo:7.0.43-jammy
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mongo-data:
