<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GetGPX — маршрут по GPX</title>

  <body>
    <main id="app"><div class="initial-loading" aria-hidden="true"><span></span><b>GETGPX</b></div></main>
